# electron-builder: packages the shell plus the Python backend into one
# self-updating installer, published to GitHub Releases. No paid signing.
# Same approach as b2renger/ComfyQ and b2renger/LlmOnLan.

appId: com.b2renger.bookmarkatlas
productName: Bookmark Atlas

files:
  - main.js
  - datafolder.js
  - assets/**
  - package.json

# The backend is a standalone Python plus the atlas package, prepared by
# scripts/prepare-backend.mjs. It sits beside the app, not inside app.asar,
# because Python has to read its files from disk.
extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"

directories:
  output: dist
  buildResources: assets

# Self-update from GitHub Releases. releaseType: release, because the updater
# ignores drafts and prereleases.
publish:
  provider: github
  owner: b2renger
  repo: Bookmark-atlas
  releaseType: release

win:
  target: nsis
  icon: assets/icon.png

# Per-user install: updates install silently, with no administrator prompt.
# The artifact name has no spaces: GitHub turns spaces into dots on upload,
# which breaks the updater's filename match in latest.yml.
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Bookmark-Atlas-Setup-${version}-windows-x64.${ext}

# Linux: one AppImage file, which can update itself like the Windows build.
linux:
  target: AppImage
  category: Utility
  icon: assets/icon.png
  executableName: bookmark-atlas
  artifactName: Bookmark-Atlas-${version}-linux-x64.${ext}

# macOS: a disk image. Without a paid Apple developer certificate the app is
# only signed "ad hoc" (identity "-"), which Apple silicon requires to run at
# all. It cannot update itself and macOS asks for confirmation on first open.
mac:
  target: dmg
  category: public.app-category.productivity
  icon: assets/icon.png
  identity: "-"
  artifactName: Bookmark-Atlas-${version}-mac-${arch}.${ext}
