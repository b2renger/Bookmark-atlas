[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-atlas"
version = "0.1.0"
description = "Explore and groom a bookmark collection stored in a local SQLite file"
readme = "README.md"
requires-python = ">=3.11"
# Phase 1 uses the standard library only. Dependencies arrive with later phases.
dependencies = []

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
