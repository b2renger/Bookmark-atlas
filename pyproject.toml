[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-atlas"
version = "0.7.1"
description = "Explore and groom a bookmark collection stored in a local SQLite file"
readme = "README.md"
requires-python = ">=3.11"
# Phase 1 uses the standard library only. Dependencies arrive with later phases.
dependencies = []

[project.optional-dependencies]
# Vectors and clustering. The desktop app bundles it.
analysis = ["numpy"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["migrations/*.sql", "web/*.html", "vendor/e_means/LICENSE", "vendor/e_means/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/atlas/vendor"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
