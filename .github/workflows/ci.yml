# Lint and tests on every push and pull request.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tools
        run: python -m pip install pytest ruff tzdata numpy

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Desktop shell syntax
        run: |
          node --check desktop/main.js
          node --test desktop/datafolder.test.js
          node --check desktop/scripts/prepare-backend.mjs
