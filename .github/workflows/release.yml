# Build the Windows installer and, on a version tag, publish it to GitHub
# Releases, where installed copies find their updates.
#
#   "Run workflow" with a version (0.3.0) -> test, build, smoke-test, then
#                          publish release v0.3.0; the tag is created here
#   push a tag vX.Y.Z   -> same, for a tag made by hand
#   "Run workflow" with the version left empty -> test, build, smoke-test; the
#                          installer is attached to the run, nothing published
#
# The version given must be the one written in pyproject.toml at that commit,
# so a release cannot be built from the wrong commit. Trial builds need nothing.
# Builds are unsigned (no paid certificate), like ComfyQ and LlmOnLan.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, like 0.3.0. Leave empty for a trial build.'
        required: false
        default: ''

# Needed to create the release and upload to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ruff tzdata numpy
      - run: ruff check .
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test desktop/datafolder.test.js

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide the version
        id: version
        shell: bash
        run: |
          asked="${{ github.event.inputs.version }}"
          asked="${asked#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$asked" ]]; then
            version="$asked"
          else
            version=""
          fi
          if [[ -n "$version" ]]; then
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version '$version' is not of the form X.Y.Z" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            # A release must be built from the commit that carries its version.
            # (v0.7.0 was once built from the commit before, because the run
            # was started while the push was still arriving.)
            declared="$(sed -n 's/^version = "\([^"]*\)".*$/\1/p' pyproject.toml | head -1)"
            if [[ "$declared" != "$version" ]]; then
              echo "Asked to publish $version, but this commit is version $declared (pyproject.toml)." >&2
              echo "Bump the version in pyproject.toml, src/atlas/__init__.py and desktop/package.json, push, then run again." >&2
              exit 1
            fi
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Install shell dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Standalone Python + the atlas package into desktop/backend.
      - name: Prepare the backend
        working-directory: desktop
        run: node scripts/prepare-backend.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The bundled Python must be able to reach Notion over HTTPS with
      # certificate checks on. A made-up token answered with 401 proves it.
      - name: Check the bundled backend
        working-directory: desktop
        shell: bash
        run: |
          backend/python/python.exe -I -u backend/run_atlas.py --db "$RUNNER_TEMP/doctor.sqlite" doctor
          # The analysis stack in the bundled runtime: vendored e-means on NumPy.
          backend/python/python.exe -I -c "import sys; sys.path.insert(0, 'backend/app'); import numpy as np; from atlas.analysis import cluster; x = np.random.default_rng(0).normal(size=(400, 8)).astype('float32'); print({a: round(cluster.fit(x, 5, algorithm=a)[2]['mse'], 3) for a in cluster.ALGORITHMS})"

      # Build only. Publishing is done below with gh, onto a release made
      # first: electron-builder's own publisher races to create the release.
      # --publish never still writes latest.yml and the blockmap.
      - name: Build the installer
        working-directory: desktop
        run: npx --no-install electron-builder --win --publish never "-c.extraMetadata.version=${{ steps.version.outputs.version }}"

      # Start the packaged app for real: backend up, page loaded, API reached.
      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $env:ATLAS_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:ATLAS_USER_DATA = Join-Path $env:RUNNER_TEMP 'atlas-data'
          $exe = 'desktop\dist\win-unpacked\Bookmark Atlas.exe'
          if (-not (Test-Path $exe)) { throw "Packaged app not found at $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(150000)) { $process.Kill(); Write-Host 'Timed out.' }
          $log = Join-Path $env:ATLAS_USER_DATA 'backend.log'
          if (Test-Path $log) { Write-Host '--- backend.log'; Get-Content $log }
          if (Test-Path $env:ATLAS_SMOKE_OUT) { Write-Host '--- result'; Get-Content $env:ATLAS_SMOKE_OUT } else { throw 'The smoke test wrote no result.' }
          $result = Get-Content $env:ATLAS_SMOKE_OUT -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "Smoke test failed: $($result.error)" }
          if ($result.version -ne '${{ steps.version.outputs.version }}') { throw "Version mismatch: app reports $($result.version)" }
          if (-not $result.packaged) { throw 'The smoke test did not run the packaged app.' }
          if ($result.dataFolderShown -ne $env:ATLAS_USER_DATA) { throw "By default the data folder should be the app's own folder, got $($result.dataFolderShown)" }

      # The same, with the data placed in a folder of the user's choosing.
      - name: Smoke-test with a chosen data folder
        shell: pwsh
        run: |
          $env:ATLAS_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke-custom.json'
          $env:ATLAS_USER_DATA = Join-Path $env:RUNNER_TEMP 'atlas-settings'
          $custom = Join-Path $env:RUNNER_TEMP 'My Atlas data'
          New-Item -ItemType Directory -Force -Path $env:ATLAS_USER_DATA | Out-Null
          # The folder must exist: a chosen folder that is missing is treated as an
          # unplugged drive, and the app refuses to start an empty collection.
          New-Item -ItemType Directory -Force -Path $custom | Out-Null
          # Written the way the app writes it when a folder is chosen in the menu.
          @{ dataFolder = $custom } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $env:ATLAS_USER_DATA 'location.json')
          $process = Start-Process -FilePath 'desktop\dist\win-unpacked\Bookmark Atlas.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(150000)) { $process.Kill(); Write-Host 'Timed out.' }
          if (-not (Test-Path $env:ATLAS_SMOKE_OUT)) { throw 'The smoke test wrote no result.' }
          Get-Content $env:ATLAS_SMOKE_OUT
          $result = Get-Content $env:ATLAS_SMOKE_OUT -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "Smoke test failed: $($result.error)" }
          if ($result.dataFolderShown -ne $custom) { throw "The backend uses $($result.dataFolderShown), expected $custom" }
          if (-not (Test-Path (Join-Path $custom 'atlas.sqlite'))) { throw 'No database was created in the chosen folder.' }
          if (Test-Path (Join-Path $env:ATLAS_USER_DATA 'atlas.sqlite')) { throw 'A database was created in the settings folder as well.' }

      # Third run: a snapshot made by the bundled backend, opened the way the
      # menu opens one, must be what the app shows.
      - name: Smoke-test opening a snapshot
        shell: pwsh
        run: |
          $py = 'desktop\backend\python\python.exe'
          $run = 'desktop\backend\run_atlas.py'
          $source = Join-Path $env:RUNNER_TEMP 'snap-source\atlas.sqlite'
          $file = Join-Path $env:RUNNER_TEMP 'Shared by CI.atlas-snapshot.sqlite'
          New-Item -ItemType Directory -Force -Path (Split-Path $source) | Out-Null
          & $py -I -u $run --db $source init
          & $py -I -u $run --db $source import-csv tests\fixtures\sample_export.csv
          & $py -I -u $run --db $source snapshot -o $file --name 'Shared by CI'
          if (-not (Test-Path $file)) { throw 'The snapshot was not written.' }
          $env:ATLAS_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke-snapshot.json'
          $env:ATLAS_USER_DATA = Join-Path $env:RUNNER_TEMP 'atlas-settings-snapshot'
          node -e "const df = require('./desktop/datafolder.js'); const path = require('path'); const s = process.env.ATLAS_USER_DATA; require('fs').mkdirSync(s, { recursive: true }); console.log('opened in', df.openSnapshot(s, process.argv[1], path.join(s, 'Snapshots'), { folder: s, source: 'default' }));" $file
          $process = Start-Process -FilePath 'desktop\dist\win-unpacked\Bookmark Atlas.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(150000)) { $process.Kill(); Write-Host 'Timed out.' }
          if (-not (Test-Path $env:ATLAS_SMOKE_OUT)) { throw 'The smoke test wrote no result.' }
          Get-Content $env:ATLAS_SMOKE_OUT
          $result = Get-Content $env:ATLAS_SMOKE_OUT -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "Smoke test failed: $($result.error)" }
          if ($result.summary -notlike '5 bookmarks*') { throw "Expected the 5 bookmarks of the snapshot, got: $($result.summary)" }
          if ($result.snapshotBanner -notlike 'Snapshot: Shared by CI*') { throw "The snapshot banner is missing: $($result.snapshotBanner)" }

      - name: List what was built
        shell: bash
        run: ls -la desktop/dist | cat

      - name: Attach the installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: Bookmark-Atlas-${{ steps.version.outputs.version }}-windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(desktop/dist/*.exe desktop/dist/*.blockmap desktop/dist/latest.yml)
          if [[ ! -f desktop/dist/latest.yml ]]; then
            echo "latest.yml is missing: installed copies could not update." >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              # What is new, written at the end of each phase.
              if [[ -f "docs/releases/$TAG.md" ]]; then
                cat "docs/releases/$TAG.md"
                echo ""
                echo "---"
                echo ""
              fi
              echo "**Windows:** download \`Bookmark-Atlas-Setup-${TAG#v}-windows-x64.exe\` and run it."
              echo ""
              echo "The installer is not signed, so Windows shows \"Windows protected your PC\" the first time: choose **More info**, then **Run anyway**."
              echo ""
              echo "Once installed, the app updates itself from these releases. Your bookmarks stay in your user data folder and are kept across updates and uninstalls."
            } > "$RUNNER_TEMP/notes.md"
            # Creates the tag on the commit that was built, if it does not exist yet.
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          fi
          echo "Uploading ${#files[@]} file(s): ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber
